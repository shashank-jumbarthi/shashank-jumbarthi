<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Shashank Jumbarthi profile banner</title>
  <desc id="desc">Cloud, DevOps, engineering banner with terminal card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
      <stop offset="0.58" stop-color="#eef4e9"/>
      <stop offset="1" stop-color="#d7e6d9"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#d9decf" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10362d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="430" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="430" rx="34" fill="url(#grid)" opacity="0.72"/>
  <path d="M0 338C202 307 369 315 560 338C768 363 976 299 1218 301C1375 302 1491 267 1600 231V430H0Z" fill="#c9dccf" opacity="0.58"/>

  <g transform="translate(78 78)">
    <rect x="0" y="0" width="430" height="42" rx="21" fill="#dce4d7" opacity="0.86"/>
    <circle cx="26" cy="21" r="6" fill="#2f5e52"/>
    <text x="46" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="7" font-weight="700" fill="#2f5e52">CLOUD • DEVOPS • ENGINEERING</text>

    <text x="0" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="4" fill="#15392f">SHASHANK JUMBARTHI</text>
    <rect x="0" y="176" width="660" height="6" rx="3" fill="#437d70"/>
    <text x="0" y="226" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#335f54">Cloud Engineer • DevOps Builder • Automation Focused</text>
    <text x="0" y="274" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" fill="#45665d">Turning infrastructure, pipelines, and operations into reliable systems you can test.</text>
  </g>

  <g transform="translate(1048 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="485" height="310" rx="24" fill="#123c32"/>
    <rect x="0" y="0" width="485" height="54" rx="24" fill="#235647"/>
    <path d="M0 34H485V54H0Z" fill="#235647"/>
    <circle cx="31" cy="27" r="7" fill="#e46f61"/>
    <circle cx="56" cy="27" r="7" fill="#e9bd58"/>
    <circle cx="81" cy="27" r="7" fill="#79b990"/>
    <text x="242" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#9bc8b8">shashank@cloud:~</text>

    <text x="31" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#8bd6b8">$ whoami</text>
    <text x="31" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbf7e8">cloud engineer</text>
    <text x="31" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbf7e8">devops builder</text>
    <text x="31" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbf7e8">automation focused</text>

    <text x="31" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#8bd6b8">$ status</text>
    <text x="31" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#fbf7e8">building // testing // shipping</text>
    <rect x="440" y="270" width="13" height="24" fill="#8bd6b8"/>
  </g>
