<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Shashank Jumbarthi cloud and DevOps banner</title>
  <desc id="desc">Blue and teal cloud engineering profile banner with pipeline nodes and a status panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.48" stop-color="#0b2a3d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10263a" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#073b45" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#78dcca" stroke-width="1" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="430" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="430" rx="34" fill="url(#grid)"/>
  <circle cx="1320" cy="72" r="190" fill="#38bdf8" opacity="0.13" filter="url(#glow)"/>
  <circle cx="220" cy="356" r="170" fill="#14b8a6" opacity="0.13" filter="url(#glow)"/>
  <path d="M0 326C188 280 372 304 548 333C756 368 917 290 1104 307C1299 325 1452 268 1600 216V430H0Z" fill="#0f172a" opacity="0.35"/>

  <g transform="translate(84 72)">
    <rect x="0" y="0" width="440" height="42" rx="21" fill="#0f766e" opacity="0.36"/>
    <circle cx="27" cy="21" r="6" fill="#67e8f9"/>
    <text x="48" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="6" font-weight="800" fill="#bff7f1">CLOUD • DEVOPS • SECURITY</text>

    <text x="0" y="144" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="850" letter-spacing="3" fill="#f8fafc">SHASHANK JUMBARTHI</text>
    <rect x="0" y="170" width="665" height="6" rx="3" fill="#38bdf8" opacity="0.92"/>
    <text x="0" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ccfbf1">Cloud Engineer • DevOps Builder • Automation Focused</text>
    <text x="0" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#bae6fd">Building reliable infrastructure, repeatable pipelines, and observable operations.</text>

    <g transform="translate(0 306)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#1e3a8a" opacity="0.82"/>
      <text x="56" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#dbeafe">AWS</text>
      <rect x="126" y="0" width="116" height="34" rx="17" fill="#0369a1" opacity="0.82"/>
      <text x="184" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#e0f2fe">AZURE</text>
      <rect x="256" y="0" width="148" height="34" rx="17" fill="#0f766e" opacity="0.82"/>
      <text x="330" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#ccfbf1">KUBERNETES</text>
      <rect x="418" y="0" width="128" height="34" rx="17" fill="#4338ca" opacity="0.82"/>
      <text x="482" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#e0e7ff">CI/CD</text>
    </g>
  </g>

  <g transform="translate(1015 74)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="286" rx="26" fill="url(#panel)" stroke="#38bdf8" stroke-opacity="0.26"/>
    <rect x="0" y="0" width="500" height="58" rx="26" fill="#082f49" opacity="0.9"/>
    <path d="M0 34H500V58H0Z" fill="#082f49" opacity="0.9"/>
    <circle cx="32" cy="29" r="7" fill="#f87171"/>
    <circle cx="58" cy="29" r="7" fill="#fbbf24"/>
    <circle cx="84" cy="29" r="7" fill="#34d399"/>
    <text x="250" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#7dd3fc">pipeline@shashank:~</text>

    <g transform="translate(43 98)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8"/>
      <circle cx="136" cy="0" r="14" fill="#2dd4bf"/>
      <circle cx="272" cy="0" r="14" fill="#818cf8"/>
      <circle cx="408" cy="0" r="14" fill="#22c55e"/>
      <path d="M14 0H122M150 0H258M286 0H394" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
      <text x="0" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#e0f2fe">plan</text>
      <text x="136" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#e0f2fe">build</text>
      <text x="272" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#e0f2fe">test</text>
      <text x="408" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#e0f2fe">ship</text>
    </g>

    <text x="43" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="800" fill="#67e8f9">$ status</text>
    <text x="43" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="800" fill="#f8fafc">terraform // docker // monitoring</text>
    <rect x="430" y="227" width="13" height="24" fill="#67e8f9"/>
  </g>
</svg>
